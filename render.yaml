# Render Infrastructure Blueprint for JALRAKSHAK
# Allows 1-click full stack deployment on Render
version: "1"

databases:
  - name: jalrakshak-db
    databaseName: jalrakshak
    user: jalrakshak_user
    plan: free
    region: oregon

services:
  # --- Backend Web Service ---
  - type: web
    name: jalrakshak-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jalrakshak-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: PORT
        value: "8000"

  # --- Frontend Static Site ---
  - type: web
    runtime: static
    name: jalrakshak-frontend
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: jalrakshak-api
          property: host

