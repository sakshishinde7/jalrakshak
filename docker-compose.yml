# JALRAKSHAK Full-Stack Docker Compose
# Deploy on any VPS, cloud server (AWS, GCP, DigitalOcean, Linode), or local Docker host
services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: jalrakshak_db
    restart: always
    environment:
      POSTGRES_DB: jalrakshak
      POSTGRES_USER: jalrakshak_user
      POSTGRES_PASSWORD: jalrakshak_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jalrakshak_user -d jalrakshak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jalrakshak_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jalrakshak_user:jalrakshak_secure_password@db:5432/jalrakshak
      FRONTEND_ORIGIN: "*"
      PORT: 8000
    ports:
      - "8000:8000"

  # 3. React/Nginx Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: jalrakshak_web
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:

